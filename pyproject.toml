[project]
name = "battlesnakes-lambda-python"
version = "0.1.0"
description = "A template for deploying a Battlesnakes-compatible API on AWS Lambda using Terraform."
authors = [
    {name = "Zane Clark",email = "zane.clark@pwc.com"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
]

[tool.poetry]
packages = [{include = "battle_python", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
